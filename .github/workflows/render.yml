name: Render video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: Composition id
        default: Short
      total_frames:
        description: Total frames
        default: "1961"
      chunks:
        description: Parallel jobs (max 20)
        default: "20"
      audio:
        description: Audio file inside public/
        default: ep1/mix.wav

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          TOTAL: ${{ inputs.total_frames }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, math, os
          total = int(os.environ["TOTAL"])
          n = int(os.environ["CHUNKS"])
          size = math.ceil(total / n)
          items = []
          i = 0
          while i * size < total:
              items.append({"idx": i, "start": i * size, "end": min(total - 1, (i + 1) * size - 1)})
              i += 1
          print("matrix=" + json.dumps({"include": items}))
          EOF

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2 libpango-1.0-0 libcairo2 libatk-bridge2.0-0
      - run: npx remotion browser ensure
      - name: Render chunk
        env:
          COMP: ${{ inputs.composition }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "$COMP" out/part_${{ matrix.idx }}.mp4 \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --muted --gl=swangle \
            --concurrency=4 --timeout=300000 --log=error
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.idx }}
          path: out/part_${{ matrix.idx }}.mp4

  assemble:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: parts
      - name: Join and add audio
        env:
          AUDIO: ${{ inputs.audio }}
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd parts
          ls part_*.mp4 | sort -V | sed "s/^/file '/; s/$/'/" > list.txt
          cat list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy ../video_only.mp4
          cd ..
          ffmpeg -y -i video_only.mp4 -i "public/$AUDIO" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
